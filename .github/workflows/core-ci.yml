name: SonicCore CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/core --parallel
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - name: Benchmark smoke
        run: build/core/soniccore_performance_test

  android-library:
    name: Android library
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build release AAR
        run: ./gradlew :android:assembleRelease :demo:assembleDebug --no-daemon --stacktrace
      - name: Package root module
        run: bash scripts/package-root-module.sh
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soniccore-android
          if-no-files-found: error
          path: |
            android/build/outputs/aar/*.aar
            demo/build/outputs/apk/debug/*.apk
            build/releases/*.zip
